# generate_data2json.py：MVTec JSON + Qwen3-VL 扩写；请只用空格缩进，不要用 Tab

paths:
  dataset_root: /data2/zlt/anomaly_detection_llm/datasets/mvtec_anomaly_detection
  input_json: /data2/zlt/anomaly_detection_llm/datasets/mvtec_zero_shot.json

logging:
  base_dir: /data2/zlt/anomaly_detection_llm/logs/generate_data_runs
  output_filename: mvtec_bbox.json
  trace_filename: llm_trace.jsonl

vlm:
  enabled: true
  # true 时需能读到图；单张读失败时仍会扩写（该样本按纯文本线索，GT bbox 仍写入答案）
  input_image: false
  model_path: /data2/zlt/anomaly_detection_llm/model_card/Qwen3-VL-8B-Instruct
  local_files_only: true
  torch_dtype: bfloat16
  attn_implementation: sdpa

generation:
  # 扩写前将已有 human 轮次改为英文、自包含（依赖 VLM；关闭 vlm.enabled 时不生效）
  rewrite_existing_questions: true
  rewrite_max_new_tokens: 160
  rewrite_max_question_chars: 400
  rewrite_prior_turn_max_chars: 600
  rewrite_paired_answer_max_chars: 900
  rewrite_temperature: 0.65
  # human 轮改写时空间详略随机：仅知缺陷类型 / 仅粗区域 / 允许细位置（权重与 _REWRITE_SPATIAL_POLICIES 顺序一致）
  rewrite_spatial_policy_weights: [0.38, 0.37, 0.25]
  num_qa_pairs_min: 1
  num_qa_pairs_max: 3
  # 扩写问题更高温度 + 多场景；回答按 terse/medium/rich/clinical 轮换
  question_temperature_boost: 0.2
  augment_max_question_chars: 220
  max_new_tokens_question: 128
  max_new_tokens_answer: 200
  temperature: 0.75
  top_p: 0.9
  do_sample: true

data:
  max_image_size: 768
  factor: 28
  max_context_chars: 700

run:
  seed: 42

output:
  json_indent: 2
  run_folder_prefix: generate_data
  # 每 N 条：原子写入 output JSON + 批量刷 llm_trace.jsonl（1 表示每条/每条 trace 都写）
  flush_every_n_samples: 100
