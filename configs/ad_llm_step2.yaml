paths:
  # 数据根目录：包含 datasets 列表中的 json 文件以及这些 json 引用的图像相对路径根目录
  dataset_root: /data2/zlt/anomaly_detection_llm/datasets
  output_dir: ./logs_step2

datasets:
  - bmad_zero_shot.json:100%
  - anomaly_shapenet_zero_shot2.json:100%


runtime:
  mode: train
  run_name: ad_llm_step2
  auto_create_output_dir: true

tensorboard:
  auto_start: true
  host: 0.0.0.0
  port: 5001

model:
  # 只用“架构/配置/词表”，不加载任何主干预训练权重（主干权重由你全量训练得到）
  # 指向本地 model_card 目录即可（必须包含 config.json + tokenizer 文件）
  random_init_llm: true
  arch: Qwen3-VL-4B-Instruct
  name: /data2/zlt/anomaly_detection_llm/model_card/Qwen3-VL-4B-Instruct
  # Step1 桥接权重见下方 bridge.bridge_ckpt_path（或在此写 model.bridge_ckpt_path，二者等价）
  local_files_only: true
  freeze_vit: true

dino:
  model_path: /data2/zlt/anomaly_detection_llm/model_card/dinov3-vitl16-pretrain-lvd1689m
  image_size: 384
  layer_indices: [12, 15, 18, 21, 24]
  use_mlp: true
  use_patch_pos_embed: true
  max_patch_pos: 4096

# CLIP 固定启用（桥接需要）
clip:
  model_path: /data2/zlt/anomaly_detection_llm/model_card/clip-vit-large-patch14
  image_size: 224
  use_mlp: true

data:
  # 数据集由顶层 datasets: [*.json] 控制；每个 json 中 image/mask 为相对 paths.dataset_root 的路径
  use_grounding_format: true
  train_anomaly_only: false
  max_image_size: 512
  factor: 28
  # true：助手回复里 <bbox> 一律变为相对「当前 smart_resize 后图像」的 0–1。
  # 有 metadata.bbox 时用 GT 重写；仅有对话内坐标时按原图像素×scale 再归一化。推理侧需同开 bbox_normalize_01。
  bbox_normalize_01: true

training:
  num_epochs: 5
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_length: 2048
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  fp16: false
  bf16: true
  gradient_checkpointing: false
  num_workers: 0
  seed: 42
  resume_from_checkpoint: null
  # --- Debug / sanity-check helpers ---
  # 训练开始前：随机保存几条训练样本（json+resize后图像）到 output_dir/data_samples
  data_snapshot_num_samples: 5
  # 每次保存 checkpoint-* 时：是否额外保存可推理目录（含 dino_bridge.bin + tokenizer）
  save_pretrained_on_save: true
  # 每次保存时：是否做随机抽样推理+特征热力图可视化（落盘到 checkpoint-*/eval_samples）
  eval_on_save: true
  # 每隔多少个 batch 做一次可视化（按 DataLoader batch 计数；不受 save_steps 影响）
  eval_every_n_steps: 100
  eval_num_samples: 5
  eval_prompt: "Does this image have any anomalies?"
  eval_heatmap_alpha: 0.45
  # true：eval 热力图与 AVNet forward 时打印 mapped/heat 统计，便于与 test_ad_llm_step1 对照（仅主进程）
  step1_visual_debug: false

distributed:
  num_gpu: 1
  deepspeed: null
  local_rank: -1
  ddp_find_unused_parameters: true

bridge:
  # Step1 的 best/epoch_*.pth：含 cls_mapper/patch_mapper；若文件顶层有 prototypes，load_bridge 会一并写入 AVNet（eval 热力图与 test 一致）
  bridge_ckpt_path: /path/to/step1/best_pixel_auroc.pth
  # 三路 patch token 软压缩成固定长度，再作为视觉前缀拼到文本前
  num_visual_tokens: 256
  compressor_num_heads: 8
  # 每路 MLP 后按各自空间网格加 2D sin-cos PE，再 concat（与旧 checkpoint 不兼容时可设 false）
  use_2d_pos_embed: true
  # CoME-VL inspired：异构网格跨路对齐
  enable_hetero_align: true
  align_num_layers: 3
  align_num_heads: 8
  align_dropout: 0.0
  use_rope_like_bias: true
  align_residual_scale: 0.1
  max_2d_pos_h: 64
  max_2d_pos_w: 64
  # 与 Step1 softmax 一致的温度；调制与热力图共用同一套 proto 对比逻辑
  prototype_temperature: 0.07
  # >0 且已加载 prototypes：进 LLM 前按 patch 异常概率拉伸 mapped（异常 patch 幅度更大）；0 则不调制
  proto_modulation_gamma: 0.5

inference:
  model_path: logs/grounding_mvtec_20260405_012114/final_model
  image_path: null
  prompt: >-
    Locate the anomaly region in this image.
  # generate 最多生成多少个新 token（必须；utils/qwen_infer.inference_main 会读取该字段）
  max_new_tokens: 2048
  temperature: 0.0
  top_p: 0.9
  do_sample: false
  # test_qwen3.py / inference_main：解析到 bbox 时保存带框图；null 表示项目根下 outputs/qwen_infer_vis
  save_visualization: true
  visual_output_dir: null
