paths:
  dataset_root: /data2/zlt/anomaly_detection_llm/datasets/mvtec_anomaly_detection
  conversation_json_path: /data2/zlt/anomaly_detection_llm/datasets/mvtec_zero_shot.json
  output_dir: ./logs

runtime:
  mode: train
  run_name: grounding_mvtec
  auto_create_output_dir: true

tensorboard:
  auto_start: true
  host: 0.0.0.0
  port: 5000

model:
  # 更小、更省显存：Qwen3-VL-2B-Instruct（先 git clone / snapshot 到 model_card 再改下面路径）
  # name: /data2/zlt/anomaly_detection_llm/model_card/Qwen3-VL-2B-Instruct
  name: /data2/zlt/anomaly_detection_llm/model_card/Qwen3-VL-4B-Instruct
  # name: /data2/zlt/anomaly_detection_llm/model_card/Qwen3-VL-8B-Instruct

  local_files_only: true
  # 全量训时易 OOM：建议 true，冻结 Qwen 自带 ViT（你走 DINO 桥时主损失多不经该塔，可明显省显存/优化器状态）
  freeze_vit: true

dino:
  model_path: /data2/zlt/anomaly_detection_llm/model_card/dinov3-vitl16-pretrain-lvd1689m
  # 与 data.max_image_size 一致或略小；512→384 可明显降桥与 mask 分支激活
  image_size: 384
  # 层数越少显存略省；可改为 [12, 24] 等
  layer_indices: [12, 16, 20, 24]
  freeze: true
  use_mlp: true
  mask_loss_weight: 0.5

# CLIP 固定启用（与 DINO 桥配套），无开关
clip:
  model_path: /data2/zlt/anomaly_detection_llm/model_card/clip-vit-large-patch14
  image_size: 224
  freeze: true
  use_mlp: true

data:
  use_grounding_format: true
  # false（默认）：JSON 里 train split 全部保留（含正常/异常）。true：训练集只保留 metadata.anomaly 为真的行
  train_anomaly_only: false
  max_image_size: 512
  factor: 28

# 主训练路径（main_qwen3 + qwen3_modeling.setup_model_and_processor）已不使用 LoRA，为全量微调。
# 保留字段仅作文档/旧脚本兼容；勿再当作会生效的开关。
lora:
  enabled: false
  r: 8
  alpha: 32
  dropout: 0.05

training:
  num_epochs: 5
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_length: 2048
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  fp16: false
  bf16: true
  gradient_checkpointing: true
  # DataLoader 子进程通过 /dev/shm 传 tensor。多卡时 num_workers>0 极易占满共享内存，出现
  # "Bus error" / "No space left on device (28)"；容器可加大 --shm-size，或此处改为 0（主进程加载，略慢但稳）
  num_workers: 0
  seed: 42
  resume_from_checkpoint: null

distributed:
  # 训练时 >1 会自动用 torch.distributed.run 启动多进程（无需命令行写 nproc_per_node）
  num_gpu: 1
  deepspeed: null
  local_rank: -1
  # 多卡时：桥接训练里部分 batch 可能无 mask / 部分参数（如未参与 loss 的层）无梯度；
  # false 会触发 DDP「Expected to have finished reduction… parameters not used in producing loss」。
  # true 略慢，但与当前模型结构兼容。
  ddp_find_unused_parameters: true

# 单图脚本 test_qwen3.py：优先读 test.image_path；未填时再用 inference.image_path
test:
  image_path: null
  # 示例: /data2/zlt/anomaly_detection_llm/datasets/mvtec_anomaly_detection/bottle/test/broken_large/000.png

inference:
  model_path: logs/grounding_mvtec_20260405_012114/final_model
  image_path: null
  # 与训练时 grounding 指令一致；否则模型容易用自然语言长段回答，parse_grounding_output 解析不到 bbox。
  # 若问「有没有缺陷」，仍用英文任务句更贴训练分布；需要中文可在命令行 --prompt 覆盖。
  prompt: >-
    Locate the anomaly region in this image and output the bbox coordinates in JSON format.
    If no anomaly is found, output {"bbox_2d": null, "label": "normal"}.
    Output only valid JSON (one object or a one-element array), no other text.
  max_new_tokens: 512
  # 推理建议关闭采样，便于遵守 JSON 格式
  temperature: 0.0
  top_p: 0.9
  do_sample: false
  # test_qwen3.py / inference_main：解析到 bbox 时保存带框图；null 表示项目根下 outputs/qwen_infer_vis
  save_visualization: true
  visual_output_dir: null
