# Qwen3.5-0.8B 通路测试：同一套 prior + LoRA GRPO，视觉塔只有 12 层。
# 单卡：CUDA_VISIBLE_DEVICES=4 python train.py --config configs/qwen35_08b_grpo.yaml --num-gpu 1
# 正式实验请改回 configs/qwen35_2b_grpo.yaml。

paths:
  dataset_root: /data2/zlt/anomaly_detection_llm/datasets
  output_dir: ./outputs/train/qwen35_08b_prior

runtime:
  mode: train
  run_name: qwen35_08b_visa2mvtec
  auto_create_output_dir: true

tensorboard:
  auto_start: true
  host: 0.0.0.0
  port: 5002
  vis_every_n_steps: 10
  vis_num_samples: 2
  log_heatmap: true
  log_case: true
  log_grpo_cot: true
  log_mvtec_probe: false

model:
  random_init_llm: false
  arch: Qwen3.5-0.8B
  name: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-0.8B
  local_files_only: true
  freeze_vit: true
  torch_dtype: bfloat16

# 0.8B ViT depth=12，不能再用 2B 的 12/16/20/24。
# 按 DualBrain 相对深度 50/67/83/100% → 1-based 层 6/8/10/12（blocks 5/7/9/11）。
prior:
  layer_index_base: 1
  layer_indices: [6, 8, 10, 12]
  softmax_temperature: 0.5
  neighborhood_radius: 0
  hint_topk: 5
  hint_nms_radius: 2
  render: colormap
  overlay_alpha: 0.45

lora:
  enabled: true
  skip_visual: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj

data:
  train_layout: visa
  train_root: /data2/zlt/anomaly_detection_llm/datasets/VisA
  eval_layout: mvtec
  eval_root: /data2/zlt/anomaly_detection_llm/datasets/mvtec_anomaly_detection
  visa_max_normal_per_class: null
  source_dirname: VisA
  train_anomaly_only: false
  random_train_ref: true
  ref_topk: 5
  normal_anomaly_ratio: 1.0
  holdout_ratio: 0.1
  max_samples: null
  max_eval_samples: null
  max_image_size: 448
  factor: null
  min_pixels: null
  max_pixels: null

prompt:
  enable_thinking: false
  user: |
    Image 1 is a defect-free normal reference of a {class_name}.
    Image 2 is the inspection image.

    The <prior_hint> contains high-response spatial points from the
    normal-reference/test feature discrepancy map H.
    These points are only spatial hints, not defect labels.
    Use them to decide where to inspect, but verify every candidate
    by directly comparing Image 1 and Image 2.

    Determine whether Image 2 contains a true anomaly.

    Output format:

    <compare>
    1-2 sentences comparing concrete visual differences.
    </compare>

    <ground>
    One sentence describing the suspicious region.
    candidate_bbox_2d=[x1,y1,x2,y2]
    </ground>

    <verify>
    One sentence verifying the candidate against Image 1 and deciding
    whether to refine it or reject it.
    </verify>

    <answer>
    {"is_anomaly": true/false, "bbox_2d": [x1,y1,x2,y2] or null, "description": "..."}
    </answer>

    Do not copy the instructional phrases above.
    Write observations specific to the two images.

    Rules:
    - Coordinates are integers in [0,1000] for Image 2.
    - candidate_bbox_2d is a proposal, not a confirmed defect; use null if nothing looks suspicious.
    - For an anomaly, candidate_bbox_2d and bbox_2d are valid boxes.
    - For a normal image, bbox_2d=null (a candidate may be rejected during <verify>).
    - Never skip a block.
    - Never repeat an opening tag.
    - After </answer>, stop.

training:
  max_length: 2048
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  seed: 42
  eval_every_n_steps: 20
  eval_num_samples: 16
  final_eval_num_samples: 32

grpo:
  group_size: 8
  policy_epochs: 3
  epochs: 2
  max_steps: null
  learning_rate: 5.0e-6
  gradient_accumulation_steps: 1
  max_new_tokens: 384
  # 0.8B 显存很宽，8 路一次 generate / logprob；actor 4 路带梯度
  rollout_micro_batch_size: 4
  logprob_micro_batch_size: 4
  actor_micro_batch_size: 2
  temperature: 0.9
  top_p: 0.95
  logging_steps: 1
  save_steps: 50
  max_grad_norm: 1.0
  adv_eps: 1.0e-6
  clip_low: 0.20
  clip_high: 0.28
  kl_beta: 1.0e-4
  min_reward_std: 0.02
  max_resample_attempts: 2
  hard_resample_attempts: 4
  small_area_thresh: 0.02
  format_advantage_weight: 0.20
  reward:
    # R_reason = reason_dir_weight * R_dir + (1-w) * delta_dense
    reason_dir_weight: 0.70
    # R_final = final_dense_weight * dense(B_f) + (1-w) * edge
    # R_ground = dense(B_c) only (no coverage term; kills oversized-box shortcut).
    final_dense_weight: 0.80
    edge_beta: 8.0
    edge_min_frac: 0.05
    keep_tol_norm1000: 8.0
    large_box_area_thresh: 0.80
    normal_correct: 1.0
    wrong_decision: -1.0
    invalid_output: -1.0
    format_weights:
      compare: 0.2
      ground: 0.3
      verify: 0.2
      answer: 0.3

distributed:
  num_gpu: 1
  deepspeed: null
  local_rank: -1
  ddp_find_unused_parameters: false

inference:
  model_path: null
  image_path: null
  prompt: null
  max_new_tokens: 384
  temperature: 0.0
  top_p: 0.9
  do_sample: false
  save_visualization: true
  visual_output_dir: null
