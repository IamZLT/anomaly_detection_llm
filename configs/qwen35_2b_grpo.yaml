# Qwen3.5-2B：冻结视觉塔多层差异先验 H + LoRA Process-Aware Spatial GRPO（无 SFT）
# 启动：python train.py --config configs/qwen35_2b_grpo.yaml
# 指定物理卡 2 和 7：
#   CUDA_VISIBLE_DEVICES=2,7 python train.py --config configs/qwen35_2b_grpo.yaml --num-gpu 2
# --num-gpu 必须等于可见 GPU 数量（不是物理编号）。

paths:
  dataset_root: /data2/zlt/anomaly_detection_llm/datasets
  # 实际 run 目录：outputs/train/qwen35_2b_prior/{run_name}_{timestamp}/
  output_dir: ./outputs/train/qwen35_2b_prior

runtime:
  mode: train
  run_name: qwen35_2b_visa2mvtec
  auto_create_output_dir: true

tensorboard:
  auto_start: true
  host: 0.0.0.0
  port: 5002
  # 默认盯本次 run 的 tb/：loss 曲线和热力图 / CoT 在同一个实验里
  vis_every_n_steps: 50     # 训练 batch 可视化；不要用 MVTec test 当每步盯盘
  vis_num_samples: 2
  log_heatmap: true
  log_case: true
  log_grpo_cot: true
  log_mvtec_probe: false    # 训练中默认不反复看同一张 MVTec 图

model:
  random_init_llm: false
  arch: Qwen3.5-2B
  name: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-2B
  local_files_only: true
  freeze_vit: true
  torch_dtype: bfloat16

# 冻结 Vision Encoder：1-based 层号 12/16/20/24 → blocks 11/15/19/23
# 对齐 DualBrain：pre-merger token + merge-unpack + 逐层 L2/NN + 距离图 softmax 融合
prior:
  layer_index_base: 1
  layer_indices: [12, 16, 20, 24]
  softmax_temperature: 0.5      # DualBrain fusion_temperature（作用在层间距离图上）
  neighborhood_radius: 0        # 0 = 对整张正常参考图做全局 patch NN（DualBrain gallery）
  hint_topk: 5                  # H → K soft spatial anchors in 0-1000
  hint_nms_radius: 2            # local-max NMS window in patch cells
  render: colormap              # TensorBoard only; H is not a third RGB image
  overlay_alpha: 0.45

lora:
  enabled: true
  skip_visual: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj

data:
  # VisA 全量训练（异常+正常全部）→ MVTec test 测试
  train_layout: visa
  train_root: /data2/zlt/anomaly_detection_llm/datasets/VisA
  eval_layout: mvtec
  eval_root: /data2/zlt/anomaly_detection_llm/datasets/mvtec_anomaly_detection
  visa_max_normal_per_class: null   # null = 每类全部 Normal
  source_dirname: VisA           # 参考图回退路径用
  train_anomaly_only: false
  # 训练时每张图从同类 normal 的 top-k（按宽高比/面积）中随机抽 I_r；eval/test 固定第一张
  random_train_ref: true
  ref_topk: 5
  # 训练采样：每类 正常:异常。1.0 = 1:1（保留全部异常，下采样正常）；null = 不限制
  normal_anomaly_ratio: 1.0
  # VisA 类内 holdout 作为 visadev；MVTec test 只在训练结束评一次
  holdout_ratio: 0.1
  max_samples: null
  max_eval_samples: null            # 完整 MVTec test（约 1725）
  # Qwen3.5 对齐单位是 patch*merge=32，不是 Qwen2.5-VL 的 28。
  # 448 是显存安全预算；更高分辨率消融把 max_image_size 改成 768。
  max_image_size: 448
  factor: null                      # null = 从模型读取 32
  min_pixels: null
  max_pixels: null

prompt:
  enable_thinking: false     # CoT 写在 XML 标签里，关闭内置 <think>
  user: |
    Image 1 is a defect-free normal reference of a {class_name}.
    Image 2 is the inspection sample.

    The <prior_hint> lists high-response points from a normal-test feature discrepancy map H.
    These points are only spatial hints. They are not defect labels.
    Verify them by comparing Image 1 and Image 2.

    Compare Image 2 with Image 1 and determine whether Image 2 contains a true anomaly.

    Return exactly four XML blocks in this order:
    <compare>, <ground>, <verify>, <answer>.

    Always output all four blocks.
    Close every block with its matching closing tag, for example </compare>.
    Do not add a colon after a tag name: write <answer>, never <answer>:.
    Do not copy or repeat the instructions.

    In <compare>:
    Describe the concrete visual differences between Image 1 and Image 2 in 1-2 concise sentences.

    In <ground>:
    Describe the most suspicious region in one concise sentence.
    Then output exactly one of:
    candidate_bbox_2d=[x1,y1,x2,y2]
    candidate_bbox_2d=null
    The field name must be written literally as candidate_bbox_2d (lowercase, with underscores, no spaces).
    Correct:   candidate_bbox_2d=[540,350,790,620]
    Wrong:     Candidate bbox 2d=[540,350,790,620]
    Wrong:     candidate bbox=[540,350,790,620]
    Wrong:     bbox_2d=[540,350,790,620]
    A candidate bbox must contain four integer coordinates in the 0-1000 coordinate system of Image 2.
    Do not output only a point.
    candidate_bbox_2d represents a suspicious proposal, not necessarily a confirmed defect.

    In <verify>:
    Re-check the candidate region against the normal reference.
    Decide whether the difference is a true defect or normal variation.
    Verification may either refine a true anomaly candidate or reject it as normal variation.
    If it is a true defect, refine the candidate region into the most accurate final defect boundary.

    In <answer>:
    Output exactly one JSON object, then close the block with </answer>.
    End your entire response with </answer> as the very last token.
    Do not emit any end-of-turn marker after </answer>.

    For an anomalous sample:
    {"is_anomaly": true, "bbox_2d": [x1,y1,x2,y2], "description": "One concise sentence describing the defect and its location relative to the normal reference."}

    For a normal sample:
    {"is_anomaly": false, "bbox_2d": null, "description": "One concise sentence stating that no clear defect is observed."}

    Consistency rules:
    - If the sample is anomalous, candidate_bbox_2d and final bbox_2d must both be valid boxes.
    - If no suspicious region is found, candidate_bbox_2d may be null.
    - If a suspicious region is found but is rejected during verification as normal variation,
      candidate_bbox_2d may be a valid box while final bbox_2d must be null.
    - If is_anomaly is false, final bbox_2d must always be null.
    - If is_anomaly is true, final bbox_2d must always be a valid box.
    - The final bbox may refine the candidate bbox after verification.
    - Do not add extra JSON fields.

    Two illustrative examples (anomalous, then normal). Their coordinates and sentences are examples only:
    do not copy them; always write coordinates and sentences for the actual Image 1 and Image 2.

    Example 1 (anomalous):
    <compare>
    Image 2 has a missing region on the object that is absent from the normal reference.
    </compare>
    <ground>
    The most suspicious region is the damaged area on the object.
    candidate_bbox_2d=[540,350,790,620]
    </ground>
    <verify>
    The region is missing only in Image 2, so the candidate is refined to tightly cover the damage.
    </verify>
    <answer>
    {"is_anomaly": true, "bbox_2d": [574,382,760,590], "description": "A localized missing region is present on the object and is absent from the normal reference."}
    </answer>

    Example 2 (normal variation rejected after verification):
    <compare>
    Image 2 contains a localized appearance difference relative to Image 1.
    </compare>
    <ground>
    A small region differs from the reference and requires verification.
    candidate_bbox_2d=[280,420,410,560]
    </ground>
    <verify>
    After comparison with the normal reference, the candidate is consistent with normal appearance variation rather than a true defect.
    </verify>
    <answer>
    {"is_anomaly": false, "bbox_2d": null, "description": "The localized difference is consistent with normal variation and no true defect is observed."}
    </answer>

training:
  max_length: 2048
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  seed: 42
  eval_every_n_steps: 50
  eval_num_samples: 32           # 过程中只评 VisA-dev
  final_eval_num_samples: null   # GRPO 结束后在完整 MVTec test 上评

grpo:
  group_size: 8
  policy_epochs: 3
  # 每卡每 step 1 张图。max_steps=null 时按 ceil(N_train * epochs / world_size)
  epochs: 2
  max_steps: null
  learning_rate: 5.0e-6
  gradient_accumulation_steps: 1
  max_new_tokens: 384
  # 逻辑 group 仍是 8。3090 单卡 24GB 只用了 ~5GB 时用 4/4/2 换速度；OOM 再降回 2/2/1
  rollout_micro_batch_size: 4
  logprob_micro_batch_size: 4
  actor_micro_batch_size: 2
  temperature: 0.9
  top_p: 0.95
  logging_steps: 1          # 终端打印；TB 的 grpo/* 每步都写（与 param 同一 step）
  save_steps: 50
  max_grad_norm: 1.0
  adv_eps: 1.0e-6
  clip_low: 0.20
  clip_high: 0.28
  kl_beta: 1.0e-4
  min_reward_std: 0.02
  max_resample_attempts: 2
  hard_resample_attempts: 4      # tiny GT 额外 resample，避免 skip 掉难例
  small_area_thresh: 0.02
  format_advantage_weight: 0.20
  reward:
    # Candidate localization: preserve GT coverage while removing zero-IoU dead zone.
    w_cov: 0.40
    w_dense_c: 0.60
    # Dense geometry (DCLR-style center + area).
    dense_w_dist: 0.60
    dense_w_area: 0.40
    # Verification/refinement.
    w_dir: 0.70
    w_progress: 0.30
    # Final localization.
    w_dense_f: 0.80
    w_edge: 0.20
    edge_beta: 8.0
    edge_min_frac: 0.05          # 边距按 GT 尺寸归一化，floor=0.05 * 图像宽/高
    keep_tol_norm1000: 8.0
    normal_correct: 1.0
    wrong_decision: -1.0
    invalid_output: -1.0
    format_weights:
      compare: 0.2
      ground: 0.3
      verify: 0.2
      answer: 0.3

distributed:
  num_gpu: 2
  deepspeed: null
  local_rank: -1
  ddp_find_unused_parameters: false

inference:
  # 仅 runtime.mode=inference 时使用；训练中的 generate 会读 max_new_tokens / temperature / top_p / do_sample
  model_path: null
  image_path: null
  prompt: null
  max_new_tokens: 384
  temperature: 0.0
  top_p: 0.9
  do_sample: false
  save_visualization: true
  visual_output_dir: null
