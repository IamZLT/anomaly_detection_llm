# Qwen3.5-2B：冻结视觉塔多层差异先验 H + LoRA Process-Aware Spatial GRPO（无 SFT）
# 启动：python train.py --config configs/qwen35_2b_grpo.yaml
# 指定物理卡 2 和 7：
#   CUDA_VISIBLE_DEVICES=2,7 python train.py --config configs/qwen35_2b_grpo.yaml --num-gpu 2
# --num-gpu 必须等于可见 GPU 数量（不是物理编号）。

paths:
  dataset_root: /data2/zlt/anomaly_detection_llm/datasets
  # 实际 run 目录：outputs/train/qwen35_2b_prior/{run_name}_{timestamp}/
  output_dir: ./outputs/train/qwen35_2b_prior

runtime:
  mode: train
  run_name: qwen35_2b_visa2mvtec
  auto_create_output_dir: true

tensorboard:
  auto_start: true
  host: 0.0.0.0
  port: 5002
  # 默认盯本次 run 的 tb/：loss 曲线和热力图 / CoT 在同一个实验里
  vis_every_n_steps: 20      # 热力图 / 案例 CoT / bbox 可视化 / GRPO group
  vis_num_samples: 2
  log_heatmap: true
  log_case: true
  log_grpo_cot: true

model:
  random_init_llm: false
  arch: Qwen3.5-2B
  name: /data2/zlt/anomaly_detection_llm/model_card/Qwen3.5-2B
  local_files_only: true
  freeze_vit: true
  torch_dtype: bfloat16

# 冻结 Vision Encoder：1-based 层号 12/16/20/24 → blocks 11/15/19/23
# 对齐 DualBrain：pre-merger token + merge-unpack + 逐层 L2/NN + 距离图 softmax 融合
prior:
  layer_index_base: 1
  layer_indices: [12, 16, 20, 24]
  softmax_temperature: 0.5      # DualBrain fusion_temperature（作用在层间距离图上）
  neighborhood_radius: 0        # 0 = 对整张正常参考图做全局 patch NN（DualBrain gallery）
  render: colormap          # colormap | overlay
  overlay_alpha: 0.45

lora:
  enabled: true
  skip_visual: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj

data:
  # VisA 全量训练（异常+正常全部）→ MVTec test 测试
  train_layout: visa
  train_root: /data2/zlt/anomaly_detection_llm/datasets/VisA
  eval_layout: mvtec
  eval_root: /data2/zlt/anomaly_detection_llm/datasets/mvtec_anomaly_detection
  visa_max_normal_per_class: null   # null = 每类全部 Normal
  source_dirname: VisA           # 参考图回退路径用
  train_anomaly_only: false
  # 训练采样：每类 正常:异常。1.0 = 1:1（保留全部异常，下采样正常）；null = 不限制
  normal_anomaly_ratio: 1.0
  holdout_ratio: 0.0
  max_samples: null
  max_eval_samples: null            # 完整 MVTec test（约 1725）
  max_image_size: 448
  factor: 28

prompt:
  enable_thinking: false     # CoT 写在 XML 标签里，关闭内置 <think>
  user: |
    Image 1 is a defect-free normal reference of a {class_name}.
    Image 2 is the inspection sample.
    Image 3 is a normal-test patch discrepancy prior H (not a ground-truth label).
    Difference in H does not mean a defect; confirm by comparing Image 1 and Image 2.
    Write a Grounded Comparative CoT with this exact tag layout:
    <compare>
    Natural language comparison of Image 1 vs Image 2, using H only as a hint.
    </compare>
    <ground>
    Natural language reason for the suspected region.
    candidate_bbox=[x1,y1,x2,y2]
    </ground>
    <verify>
    Re-check against Image 1: texture, lighting, pose, or a true defect.
    </verify>
    <boundary>
    For each edge, choose exactly ONE value from: inward, outward, keep.
    Do not list multiple alternatives.
    left=inward
    right=outward
    top=keep
    bottom=inward
    </boundary>
    <answer>
    is_anomaly=true
    bbox=[x1,y1,x2,y2]
    </answer>
    Coordinates are Qwen official 0-1000 on Image 2.
    If the sample is normal, set candidate_bbox=null and write:
    is_anomaly=false
    bbox=null

training:
  max_length: 2048
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  seed: 42
  eval_every_n_steps: 50
  eval_num_samples: 8            # GRPO 过程中抽检张数
  final_eval_num_samples: null   # GRPO 结束后在完整 MVTec test 上评

grpo:
  group_size: 8
  policy_epochs: 3
  # 每卡每 step 1 张图。max_steps=null 时按 ceil(N_train * epochs / world_size)
  epochs: 2
  max_steps: null
  learning_rate: 5.0e-6
  gradient_accumulation_steps: 1
  max_new_tokens: 768
  temperature: 0.9
  top_p: 0.95
  logging_steps: 1          # 终端打印；TB 的 grpo/* 每步都写（与 param 同一 step）
  save_steps: 50
  max_grad_norm: 1.0
  adv_eps: 1.0e-6
  clip_low: 0.20
  clip_high: 0.28
  kl_beta: 1.0e-4
  min_reward_std: 0.02
  max_resample_attempts: 2
  reward:
    w_cov: 0.7
    w_compact: 0.3
    w_iou: 0.45
    w_edge: 0.40
    w_center: 0.15
    edge_beta: 8.0
    center_gamma: 8.0
    keep_tol_norm1000: 8.0
    format_weight: 0.03
    cls_correct: 1.0
    cls_wrong: -1.0
    cls_invalid: -0.5
    normal_false_positive: -0.5
    a_ground_on_ground: 0.6
    a_cls_on_ground: 0.2
    a_box_on_ground: 0.2
    a_reason_on_reason: 0.3
    a_cls_on_reason: 0.3
    a_box_on_reason: 0.4
    a_cls_on_answer: 0.7
    a_box_on_answer: 0.3

distributed:
  num_gpu: 2
  deepspeed: null
  local_rank: -1
  ddp_find_unused_parameters: false

inference:
  # 仅 runtime.mode=inference 时使用；训练中的 generate 会读 max_new_tokens / temperature / top_p / do_sample
  model_path: null
  image_path: null
  prompt: null
  max_new_tokens: 768
  temperature: 0.0
  top_p: 0.9
  do_sample: false
  save_visualization: true
  visual_output_dir: null
